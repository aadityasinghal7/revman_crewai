analyze_historical_trends:
  description: |
    Analyze the historical price data file to calculate week-over-week percentage price changes for all SKUs.

    ===========================================================================
    CRITICAL: USE THIS EXACT FILE PATH - DO NOT CHANGE OR MAKE UP A FILENAME
    ===========================================================================
    
    FILE PATH TO USE: {historical_file_path}
    
    The file contains the following columns:
    - SKU: Product identifier with brand, pack size, volume, and type details
    - BRAND: Brand name
    - Pack Size: Pack size
    - Pack Volume ml: Volume in milliliters
    - Pack Type: Bottles or cans
    - Week: Week of the price in the market
    - Price: Price in the market

    CORRECT TOOL CALL FORMAT:
    ```
    Action: Historical Price Analyzer
    Action Input: {{"file_path": "{historical_file_path}"}}
    ```
    
    DO NOT:
    - Make up file names like "historical_prices.xlsx"
    - Change the file path in any way
    - Use any path other than the one provided above
    
    The tool will:
    1. Read the Excel file at the provided path
    2. Calculate week-over-week percentage changes for each SKU
    3. Compute statistical measures: mean, standard deviation, min, max
    4. Return latest price and week for each SKU
    5. Analyze all 108 SKUs

    CRITICAL: Return the complete JSON result from the tool. This data will be passed via
    context to the next task for forecasting.

  expected_output: |
    A comprehensive JSON structure containing:
    - SKU-level analysis with statistical summaries (mean, std dev, all historical changes)
    - Latest price and week for each SKU
    - Total number of SKUs analyzed (should be 108)
    - Brand, pack size, volume, and type details for each SKU

    This data will be passed via context to the forecasting task.

  agent: pricing_trend_analyst_agent


forecast_next_week_prices:
  description: |
    Using the historical trend analysis from the previous task (available in your context),
    forecast the expected price for each SKU in the next week.

    ===========================================================================
    CRITICAL: YOU MUST USE DATA FROM YOUR CONTEXT - DO NOT USE FILE PATHS
    ===========================================================================
    
    The previous task (analyze_historical_trends) has already provided the sku_analysis data
    in your context. You MUST extract this data and pass it to the PriceForecastingTool.
    
    STEP-BY-STEP INSTRUCTIONS:
    1. Look in your context for the JSON output from the analyze_historical_trends task
    2. Find the "sku_analysis" key in that JSON data
    3. Pass this sku_analysis data directly to the PriceForecastingTool using the "sku_analysis" parameter
    
    CORRECT TOOL CALL FORMAT:
    ```
    Action: Price Forecaster
    Action Input: {{"sku_analysis": <the sku_analysis dict from your context>}}
    ```
    
    DO NOT:
    - Use file paths like "historical_prices.xlsx" or "sku_analysis.json"
    - Try to read files from disk
    - Make up file names
    
    The tool accepts the "sku_analysis" parameter directly - no file reading needed!
    
    The forecast uses trend-based calculation with exponential weighted moving average that
    considers recent price movements more heavily than older historical data.

  expected_output: |
    A JSON structure containing forecasts for all SKUs:
    - SKU identifier and details (brand, pack size, type)
    - Current price (from latest week)
    - Forecasted price for next week
    - Forecasted percentage change
    - Historical mean and standard deviation of price changes
    - Total number of SKUs forecasted (should be 108)

    This forecasted data will be passed via context to the anomaly detection task.

  agent: pricing_trend_analyst_agent
  context:
    - analyze_historical_trends


identify_notable_changes:
  description: |
    Identify the top 10 SKUs with the most statistically significant price changes by comparing
    the forecasted change against historical volatility patterns.

    ===========================================================================
    CRITICAL: YOU MUST USE DATA FROM YOUR CONTEXT - DO NOT USE FILE PATHS
    ===========================================================================
    
    The previous task (forecast_next_week_prices) has already provided the forecasts data
    in your context. You MUST extract this data and pass it to the AnomalyDetectionTool.
    
    STEP-BY-STEP INSTRUCTIONS:
    1. Look in your context for the JSON output from the forecast_next_week_prices task
    2. Find the "forecasts" key in that JSON data
    3. Pass this forecasts data directly to the AnomalyDetectionTool using the "forecasts" parameter
    
    CORRECT TOOL CALL FORMAT:
    ```
    Action: Price Anomaly Detector
    Action Input: {{"forecasts": <the forecasts dict from your context>}}
    ```
    
    DO NOT:
    - Use file paths like "historical_prices.xlsx" or "price_forecasts.json"
    - Try to read files from disk
    - Make up file names
    
    The tool accepts the "forecasts" parameter directly - no file reading needed!
    
    For each SKU, the tool calculates the z-score: how many standard deviations the forecasted change
    is from the historical mean change. It returns exactly 10 SKUs ranked by statistical significance.

    Focus on identifying changes that are UNEXPECTED based on historical patterns, not just
    large absolute changes.

  expected_output: |
    A JSON structure with exactly 10 SKUs, ranked by statistical significance:

    For each SKU, include:
    - SKU details (brand, pack size, volume, type)
    - Current price and forecasted price
    - Price change in dollars and percentage
    - Z-score (statistical significance)
    - Significance label (e.g., "2.3σ")
    - Historical mean and standard deviation for context

    Also include:
    - Total number of SKUs analyzed (should always be 10 in the top list)
    - Threshold used (deprecated parameter, no longer affects results)
    - Analysis timestamp

    This output will be formatted into a table and appended to the price change email.

  agent: pricing_trend_analyst_agent
  context:
    - forecast_next_week_prices
