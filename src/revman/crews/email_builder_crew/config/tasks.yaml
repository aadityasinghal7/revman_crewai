    PRICING TREND FORECAST – Next Week
    Top 10 Notable Price Changes (Statistically Significant)

    Based on historical trend analysis. Significance measured in standard deviations (σ) from historical patterns.

    Product                          Pack    Current    Forecast   Change      Significance
    -------------------------------- ------- ---------- ---------- ----------- ------------
    Budweiser                        24B     $45.99     $48.50     +$2.51 (+5.5%)   2.3σ
    Corona Extra                     12C     $28.99     $26.75     -$2.24 (-7.7%)   2.1σ
    ...

    ---

    Best regards,
    Mark Robinson

    The output should be:
    - Plain text format (NOT HTML)
    - Include subject line with em dash (–)
    - Include opening text with effective date
    - Include pack size notation
    - Properly organized by brewer hierarchy
    - Each product line formatted as: Product PackSize +/-$Amount to $FinalPrice
    - NO business context or commentary (except in pricing forecast section which needs context)
    - If pricing forecast top_10_notable_changes array has items, MUST include "PRICING TREND FORECAST" section after NEW SKUs
    - Include professional closing
    - Ready to send directly

    ⚠️ FINAL VALIDATION CHECKLIST BEFORE SUBMITTING OUTPUT ⚠️
    ===========================================================
    Before you return your email output, STOP and verify:

    ✓ Step 1: Did you check pricing_forecast_analysis at the beginning?
    ✓ Step 2: If top_10_notable_changes array had items (len > 0), did you include "PRICING TREND FORECAST – Next Week" section?
    ✓ Step 3: Is the forecast section positioned AFTER "LICENSEE CHANGES" and BEFORE "Best regards,"?
    ✓ Step 4: Does the forecast section include ALL items from the top_10_notable_changes array?
    ✓ Step 5: Is the forecast table formatted with proper columns and alignment?

    ❌ If you answered NO to Step 2 and data exists:
       STOP! GO BACK and add the "PRICING TREND FORECAST" section NOW before submitting.
       This is a CRITICAL ERROR if you skip this section when data exists.

    ✅ If you answered YES to all steps: Submit your output.

  agent: email_content_writer_agent
